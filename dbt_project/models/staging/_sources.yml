version: 2

sources:
  - name: raw
    description: >
      Tables loaded directly by Dagster assets (not by dbt) from the NYC TLC
      open-data feed. dbt treats these as the lineage boundary: everything
      downstream of `source('raw', ...)` is dbt's responsibility; everything
      upstream is the substrate plane's.
    tables:
      - name: trips
        description: Raw yellow-taxi trip records, one row per trip, loaded verbatim from the NYC Open Data Socrata API (dataset 4b4i-vvec, "2023 Yellow Taxi Trip Data").
        loaded_at_field: tpep_pickup_datetime
        freshness:
          warn_after: {count: 90, period: day}
        columns:
          - name: vendorid
            tests: [not_null]
          - name: tpep_pickup_datetime
            tests: [not_null]
          - name: pulocationid
            tests: [not_null]
          - name: dolocationid
            tests: [not_null]
